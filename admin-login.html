<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KROOZ'IN Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1720;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        .brand h1 {
            font-size: 30px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #aab7c2;
            font-size: 14px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .login-card h2 {
            color: #14212b;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .login-card .subtitle {
            color: #6b7780;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #26343d;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d7dde1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #1d6f8a;
            box-shadow: 0 0 0 3px rgba(29, 111, 138, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1d6f8a;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #15566b;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #a42828;
            border: 1px solid #f3c5c5;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #91a0aa;
            font-size: 12px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1d6f8a;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">
            <h1>KROOZ'IN</h1>
            <p>General Services</p>
        </div>

        <div class="login-card">

            <h2>Admin Login</h2>

            <p class="subtitle">
                Sign in to access the KROOZ'IN management dashboard.
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" placeholder="Enter admin username"
                        autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Enter admin password"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" id="loginButton">
                    Sign In
                </button>

            </form>

            <a href="/" class="back-link">
                ← Back to KROOZ'IN website
            </a>

        </div>

        <div class="footer">
            © 2026 KROOZ'IN General Services. Admin Portal.
        </div>

    </div>


    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            message.className = "message";
            message.textContent = "";

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {

                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {

                    window.location.href = "/admin.html";

                } else {

                    message.className = "message error";
                    message.textContent =
                        data.message || "Invalid username or password.";

                }

            } catch (error) {

                console.error(error);

                message.className = "message error";
                message.textContent =
                    "Unable to connect to the server. Please try again.";

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";

            }

        });
    </script>

</body>

</html>
